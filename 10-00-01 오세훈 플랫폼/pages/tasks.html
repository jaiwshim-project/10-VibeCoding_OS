<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태스크 협업 관리판 — 오세훈 캠프</title>
  <link rel="stylesheet" href="../styles/design-system.css">
  <script src="../js/auth.js"></script>
  <style>
    /* ========== 레이아웃 ========== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    /* ========== 네비게이션 ========== */
    .navbar {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 200;
      padding: var(--space-4) var(--space-6);
    }

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-logo {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: var(--primary);
      text-decoration: none;
      flex-shrink: 0;
    }

    .navbar-menu {
      display: flex;
      gap: var(--space-6);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .navbar-menu a {
      text-decoration: none;
      color: var(--text);
      font-weight: var(--font-weight-medium);
      transition: color var(--transition);
      font-size: var(--font-size-base);
      white-space: nowrap;
    }

    .navbar-menu a:hover { color: var(--primary); }

    .navbar-menu a.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 4px;
    }

    /* ========== 페이지 헤더 ========== */
    .page-header {
      margin-bottom: var(--space-8);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-4);
    }

    .page-header h1 {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      margin: 0 0 var(--space-2) 0;
    }

    .page-header p {
      font-size: var(--font-size-lg);
      color: var(--text-secondary);
      margin: 0;
    }

    /* ========== 통계 카드 ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .stat-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .stat-number {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-1);
    }

    .stat-label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    .stat-total .stat-number { color: var(--text); }
    .stat-pending .stat-number { color: var(--text-secondary); }
    .stat-progress .stat-number { color: #f59e0b; }
    .stat-done .stat-number { color: var(--success); }
    .stat-overdue .stat-number { color: var(--danger); }

    /* ========== 필터 / 검색 바 ========== */
    .toolbar {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-search {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .toolbar-search input {
      width: 100%;
      padding: var(--space-3) var(--space-3) var(--space-3) 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-family: inherit;
      transition: border-color var(--transition);
    }

    .toolbar-search input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.08);
    }

    .toolbar-search .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 16px;
    }

    .toolbar select {
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-family: inherit;
      cursor: pointer;
      background: white;
      transition: border-color var(--transition);
    }

    .toolbar select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* ========== 뷰 전환 버튼 ========== */
    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .view-btn {
      padding: var(--space-3) var(--space-4);
      background: white;
      border: none;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .view-btn.active {
      background: var(--primary);
      color: white;
    }

    .view-btn:hover:not(.active) {
      background: var(--bg-lighter);
    }

    /* ========== 메인 레이아웃 ========== */
    .main-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: var(--space-8);
    }

    /* ========== 태스크 생성 폼 ========== */
    .task-form-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 80px;
    }

    .task-form-panel h2 {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      margin-bottom: var(--space-5);
      padding-bottom: var(--space-4);
      border-bottom: 2px solid var(--primary);
    }

    .form-group {
      margin-bottom: var(--space-4);
    }

    .form-group label {
      display: block;
      font-weight: var(--font-weight-medium);
      color: var(--text);
      margin-bottom: var(--space-2);
      font-size: var(--font-size-sm);
    }

    .form-group label .required {
      color: var(--primary);
      margin-left: 2px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: var(--font-size-sm);
      transition: border-color var(--transition);
      background: white;
      color: var(--text);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.08);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }

    /* 태그 입력 */
    .tag-input-container {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      cursor: text;
      transition: border-color var(--transition);
      background: white;
    }

    .tag-input-container:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.08);
    }

    .tag-chip {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs, 11px);
      font-weight: var(--font-weight-medium);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .tag-input {
      border: none !important;
      padding: 0 !important;
      outline: none !important;
      font-size: var(--font-size-sm);
      min-width: 100px;
      flex: 1;
      box-shadow: none !important;
    }

    /* 체크리스트 (서브태스크) */
    .checklist-area {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .checklist-item-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-bottom: 1px solid var(--border);
    }

    .checklist-item-row:last-child { border-bottom: none; }

    .checklist-add-row {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
    }

    .checklist-add-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-size-sm);
      font-family: inherit;
    }

    .checklist-add-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-icon-small {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
      background: var(--bg-lighter);
      color: var(--text-secondary);
    }

    .btn-icon-small:hover {
      background: var(--primary);
      color: white;
    }

    .btn-primary {
      width: 100%;
      padding: var(--space-4);
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      cursor: pointer;
      transition: background var(--transition);
      margin-top: var(--space-4);
    }

    .btn-primary:hover { background: #c70011; }

    /* ========== 칸반 보드 뷰 ========== */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }

    .kanban-col {
      background: var(--bg-lighter);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }

    .kanban-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .kanban-col-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .kanban-badge {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 2px 10px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--text-secondary);
    }

    .kanban-cards {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-height: 80px;
    }

    /* ========== 태스크 카드 ========== */
    .task-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      cursor: pointer;
    }

    .task-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .task-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .task-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      margin: 0;
      flex: 1;
      line-height: 1.4;
    }

    .priority-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .priority-dot.high { background: var(--danger); }
    .priority-dot.medium { background: var(--warning); }
    .priority-dot.low { background: var(--success); }

    .task-description {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-3);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 진행률 바 */
    .progress-bar-wrap {
      margin-bottom: var(--space-3);
    }

    .progress-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .progress-bar-track {
      height: 6px;
      background: var(--bg-lighter);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--primary);
      transition: width 0.4s ease;
    }

    .progress-bar-fill.done { background: var(--success); }

    /* 태그 */
    .task-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: var(--space-3);
    }

    .task-tag {
      background: var(--bg-lighter);
      color: var(--text-secondary);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--font-weight-medium);
    }

    /* 담당자 아바타 */
    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .assignees-row {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      color: white;
      border: 2px solid white;
      flex-shrink: 0;
    }

    .avatar:not(:first-child) { margin-left: -8px; }

    .avatar-colors {
      --c0: #E60012; --c1: #3b82f6; --c2: #8b5cf6;
      --c3: #f59e0b; --c4: #10b981; --c5: #ef4444;
    }

    .task-meta-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .due-badge {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .due-badge.overdue { color: var(--danger); font-weight: var(--font-weight-bold); }
    .due-badge.soon { color: var(--warning); font-weight: var(--font-weight-medium); }

    .comment-count {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ========== 리스트 뷰 ========== */
    .list-view {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .list-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      align-items: center;
      gap: var(--space-4);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
    }

    .list-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    .list-card-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .list-status-badge {
      display: inline-block;
      padding: 3px var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .list-status-badge.pending { background: #f0f0f0; color: var(--text-secondary); }
    .list-status-badge.in-progress { background: #fff3cd; color: #856404; }
    .list-status-badge.completed { background: #d4edda; color: #155724; }

    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .priority-badge.high { color: var(--danger); }
    .priority-badge.medium { color: var(--warning); }
    .priority-badge.low { color: var(--success); }

    /* ========== 상태 알림 ========== */
    .alert {
      padding: var(--space-4);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
    }

    .alert-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .alert-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .alert-info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }

    /* ========== 모달 (태스크 상세 + 댓글) ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: var(--space-6);
      border-bottom: 1px solid var(--border);
      gap: var(--space-4);
    }

    .modal-header h2 {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      margin: 0;
      flex: 1;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .modal-close:hover { color: var(--primary); }

    .modal-body {
      padding: var(--space-6);
      flex: 1;
    }

    .modal-section {
      margin-bottom: var(--space-6);
    }

    .modal-section h3 {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .modal-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }

    .modal-meta-item label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      display: block;
      margin-bottom: var(--space-1);
    }

    .modal-meta-item span {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      color: var(--text);
    }

    /* 서브태스크 (체크리스트) 모달 */
    .sub-task-list {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .sub-task-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    .sub-task-item:last-child { border-bottom: none; }
    .sub-task-item:hover { background: var(--bg-light); }

    .sub-task-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .sub-task-item label {
      flex: 1;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--text);
    }

    .sub-task-item.checked label {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    /* 담당자 섹션 */
    .assignee-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .assignee-chip {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--bg-lighter);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-size-sm);
    }

    .assignee-chip .avatar {
      width: 24px;
      height: 24px;
      font-size: 10px;
    }

    /* 댓글 섹션 */
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .comment-item {
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
    }

    .comment-body {
      flex: 1;
      background: var(--bg-light);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
    }

    .comment-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .comment-author {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--text);
    }

    .comment-time {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    .comment-text {
      font-size: var(--font-size-sm);
      color: var(--text);
      line-height: 1.6;
    }

    .comment-input-row {
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
    }

    .comment-input-row textarea {
      flex: 1;
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: var(--font-size-sm);
      resize: none;
      min-height: 60px;
      transition: border-color var(--transition);
    }

    .comment-input-row textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.08);
    }

    .btn-comment {
      padding: var(--space-3) var(--space-5);
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: var(--font-weight-medium);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: background var(--transition);
      white-space: nowrap;
    }

    .btn-comment:hover { background: #c70011; }

    /* 모달 액션 버튼 */
    .modal-actions {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-5) var(--space-6);
      border-top: 1px solid var(--border);
      justify-content: flex-end;
    }

    .btn-secondary {
      padding: var(--space-3) var(--space-5);
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-weight: var(--font-weight-medium);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: var(--bg-lighter);
      border-color: var(--text-secondary);
    }

    .btn-danger {
      padding: var(--space-3) var(--space-5);
      background: var(--danger);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: var(--font-weight-medium);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: background var(--transition);
    }

    .btn-danger:hover { background: #dc2626; }

    /* ========== 상태 진행 스텝 ========== */
    .status-steps {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .status-step {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      text-align: center;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      background: white;
      color: var(--text-secondary);
      border: none;
      border-right: 1px solid var(--border);
      transition: var(--transition);
    }

    .status-step:last-child { border-right: none; }
    .status-step:hover:not(.active) { background: var(--bg-lighter); }
    .status-step.active.pending { background: #f0f0f0; color: var(--text); }
    .status-step.active.in-progress { background: #fff3cd; color: #856404; }
    .status-step.active.completed { background: #d4edda; color: #155724; }

    /* ========== 빈 상태 ========== */
    .empty-state {
      text-align: center;
      padding: var(--space-12) var(--space-6);
      color: var(--text-secondary);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: var(--space-4);
    }

    .empty-state p {
      font-size: var(--font-size-lg);
      margin-bottom: var(--space-2);
    }

    .empty-state small {
      font-size: var(--font-size-sm);
    }

    /* ========== 반응형: 태블릿 ========== */
    @media (max-width: 1024px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); }
      .main-layout { grid-template-columns: 300px 1fr; }
      .kanban-board { grid-template-columns: 1fr 1fr; }
    }

    /* ========== 반응형: 모바일 ========== */
    @media (max-width: 768px) {
      .container { padding: var(--space-4); }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-card { padding: var(--space-4); }
      .stat-number { font-size: var(--font-size-2xl); }

      .main-layout {
        grid-template-columns: 1fr;
      }

      .task-form-panel {
        position: static;
        order: -1;
      }

      .kanban-board {
        grid-template-columns: 1fr;
      }

      .toolbar {
        gap: var(--space-2);
      }

      .toolbar-search { min-width: 100%; order: -1; }

      .page-header {
        flex-direction: column;
        gap: var(--space-3);
      }

      .list-card {

      }

    let currentView = 'kanban';
    let currentTaskId = null;
    let formAssignees = [];
    let formTags = [];
    let formSubtasks = [];

    // 현재 사용자 (auth.js에서)
    const currentUser = (typeof getCurrentUser === 'function') ? getCurrentUser() : { username: 'admin' };

    /* ------ 초기화 ------ */
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initAuth === 'function') initAuth();
      loadData();
      initFormListeners();
      if (typeof initMobileNav === 'function') initMobileNav();
    });

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      allTasks = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(INITIAL_TASKS));
      const storedComments = localStorage.getItem(COMMENTS_KEY);
      allComments = storedComments ? JSON.parse(storedComments) : {};
      updateAssigneeFilter();
      renderAll();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allTasks));
      localStorage.setItem(COMMENTS_KEY, JSON.stringify(allComments));
    }

    /* ------ 담당자 필터 갱신 ------ */
    function updateAssigneeFilter() {
      const sel = document.getElementById('assigneeFilter');
      const all = new Set();
      allTasks.forEach(t => (t.assignees || []).forEach(a => all.add(a)));
      const current = sel.value;
      sel.innerHTML = '<option value="all">모든 담당자</option>';
      Array.from(all).sort().forEach(a => {
        const opt = document.createElement('option');
        opt.value = a; opt.textContent = a;
        if (a === current) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    /* ------ 통계 업데이트 ------ */
    function updateStats(tasks) {
      const today = new Date(); today.setHours(0,0,0,0);
      const total = tasks.length;
      const pending = tasks.filter(t => t.status === 'pending').length;
      const progress = tasks.filter(t => t.status === 'in-progress').length;
      const done = tasks.filter(t => t.status === 'completed').length;
      const overdue = tasks.filter(t => {
        if (!t.due_date || t.status === 'completed') return false;
        return new Date(t.due_date) < today;
      }).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statProgress').textContent = progress;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statOverdue').textContent = overdue;
    }

    /* ------ 필터링 ------ */
    function getFiltered() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const priority = document.getElementById('priorityFilter').value;
      const assignee = document.getElementById('assigneeFilter').value;

      return allTasks.filter(t => {
        if (search && !t.title.toLowerCase().includes(search) && !(t.description || '').toLowerCase().includes(search)) return false;
        if (status !== 'all' && t.status !== status) return false;
        if (priority !== 'all' && t.priority !== priority) return false;
        if (assignee !== 'all' && !(t.assignees || []).includes(assignee)) return false;
        return true;
      });
    }

    function filterTasks() { renderAll(); }

    /* ------ 렌더링 메인 ------ */
    function renderAll() {
      const filtered = getFiltered();
      updateStats(filtered);

      if (currentView === 'kanban') {
        renderKanban(filtered);
      } else {
        renderList(filtered);
      }
    }

    /* ------ 칸반 렌더링 ------ */
    function renderKanban(tasks) {
      const cols = { pending: [], 'in-progress': [], completed: [] };
      tasks.forEach(t => { if (cols[t.status]) cols[t.status].push(t); });

      document.getElementById('kb-pending').textContent = cols.pending.length;
      document.getElementById('kb-progress').textContent = cols['in-progress'].length;
      document.getElementById('kb-done').textContent = cols.completed.length;

      document.getElementById('col-pending').innerHTML = cols.pending.map(taskCardHtml).join('') || emptyColHtml();
      document.getElementById('col-in-progress').innerHTML = cols['in-progress'].map(taskCardHtml).join('') || emptyColHtml();
      document.getElementById('col-completed').innerHTML = cols.completed.map(taskCardHtml).join('') || emptyColHtml();
    }

    function emptyColHtml() {
      return '<div class="empty-state"><p>태스크 없음</p></div>';
    }

    function taskCardHtml(task) {
      const today = new Date(); today.setHours(0,0,0,0);
      const due = task.due_date ? new Date(task.due_date) : null;
      const daysLeft = due ? Math.ceil((due - today) / 86400000) : null;
      const isOverdue = due && daysLeft < 0 && task.status !== 'completed';
      const isSoon = due && daysLeft >= 0 && daysLeft <= 3 && task.status !== 'completed';

      const dueLabelClass = isOverdue ? 'overdue' : (isSoon ? 'soon' : '');
      const dueLabel = due ? `📅 ${task.due_date}` : '';
      const dueBadge = dueLabel ? `<span class="due-badge ${dueLabelClass}">${dueLabel}${isOverdue ? ' 초과!' : (isSoon ? ` (D-${daysLeft})` : '')}</span>` : '';

      // 진행률 (서브태스크)
      const subs = task.subtasks || [];
      const doneCount = subs.filter(s => s.done).length;
      const progress = subs.length ? Math.round(doneCount / subs.length * 100) : (task.status === 'completed' ? 100 : 0);
      const progressFillClass = progress === 100 ? 'done' : '';
      const progressHtml = subs.length ? `
        <div class="progress-bar-wrap">
          <div class="progress-bar-label"><span>서브태스크</span><span>${doneCount}/${subs.length}</span></div>
          <div class="progress-bar-track"><div class="progress-bar-fill ${progressFillClass}" style="width:${progress}%"></div></div>
        </div>` : '';

      // 담당자 아바타
      const assignees = task.assignees || [];
      const avatarsHtml = assignees.slice(0, 4).map((a, i) => {
        const colors = ['#E60012','#3b82f6','#8b5cf6','#f59e0b','#10b981'];
        const initials = a.substring(0, 2);
        return `<div class="avatar" style="background:${colors[i % colors.length]};" title="${escapeHtml(a)}">${escapeHtml(initials)}</div>`;
      }).join('');
      const extraCount = assignees.length > 4 ? `<div class="avatar" style="background:#6b7280;">+${assignees.length - 4}</div>` : '';

      // 태그
      const tagsHtml = (task.tags || []).map(t => `<span class="task-tag">${escapeHtml(t)}</span>`).join('');

      // 댓글 수
      const commentCount = (allComments[task.id] || []).length;
      const commentBadge = commentCount ? `<span class="comment-count">💬 ${commentCount}</span>` : '';

      return `
        <div class="task-card" onclick="openModal(${task.id})" role="button" tabindex="0" aria-label="${escapeHtml(task.title)}">
          <div class="task-card-top">
            <h3 class="task-title">${escapeHtml(task.title)}</h3>
            <div class="priority-dot ${task.priority}" title="우선순위: ${task.priority}"></div>
          </div>
          ${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ''}
          ${progressHtml}
          ${tagsHtml ? `<div class="task-tags">${tagsHtml}</div>` : ''}
          <div class="task-footer">
            <div class="assignees-row">${avatarsHtml}${extraCount}</div>
            <div class="task-meta-right">
              ${commentBadge}
              ${dueBadge}
            </div>
          </div>
        </div>`;
    }

    /* ------ 목록 렌더링 ------ */
    function renderList(tasks) {
      const container = document.getElementById('listViewContent');
      if (tasks.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p>표시할 태스크가 없습니다</p><small>필터를 변경하거나 새 태스크를 생성하세요</small></div>`;
        return;
      }

      const priorityLabel = { high: '높음', medium: '중간', low: '낮음' };
      const statusLabel = { pending: '대기 중', 'in-progress': '진행 중', completed: '완료' };

      container.innerHTML = tasks.map(task => `
        <div class="list-card" onclick="openModal(${task.id})" role="button" tabindex="0" aria-label="${escapeHtml(task.title)}">
          <div class="list-card-title">
            <div class="priority-dot ${task.priority}"></div>
            ${escapeHtml(task.title)}
          </div>
          <span class="list-status-badge ${task.status}">${statusLabel[task.status]}</span>
          <span class="priority-badge ${task.priority} list-card-priority">● ${priorityLabel[task.priority]}</span>
          <span class="list-card-assignee" style="font-size:var(--font-size-sm);color:var(--text-secondary);">${(task.assignees || []).join(', ')}</span>
          <span style="font-size:var(--font-size-sm);color:var(--text-secondary);">${task.due_date || '-'}</span>
        </div>`).join('');
    }

    /* ------ 뷰 전환 ------ */
    function switchView(view) {
      currentView = view;
      document.getElementById('kanbanView').style.display = view === 'kanban' ? '' : 'none';
      document.getElementById('listView').style.display = view === 'list' ? '' : 'none';
      document.getElementById('btnKanban').classList.toggle('active', view === 'kanban');
      document.getElementById('btnList').classList.toggle('active', view === 'list');
      document.getElementById('btnKanban').setAttribute('aria-pressed', view === 'kanban');
      document.getElementById('btnList').setAttribute('aria-pressed', view === 'list');
      renderAll();
    }

    /* ==========================================
       태스크 생성 폼
       ========================================== */
    function initFormListeners() {
      // 담당자 태그
      document.getElementById('fAssigneeInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = e.target.value.trim();
          if (val) addFormAssignee(val);
          e.target.value = '';
        }
      });

      // 태그
      document.getElementById('fTagInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = e.target.value.trim().replace(/^#/, '');
          if (val) addFormTag(val);
          e.target.value = '';
        }
      });

      // 서브태스크
      document.getElementById('checklistInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addChecklistItem();
        }
      });
    }

    function addFormAssignee(name) {
      if (formAssignees.includes(name)) return;
      formAssignees.push(name);
      renderFormAssignees();
    }

    function removeFormAssignee(name) {
      formAssignees = formAssignees.filter(a => a !== name);
      renderFormAssignees();
    }

    function renderFormAssignees() {
      document.getElementById('assigneeChips').innerHTML = formAssignees.map(a =>
        `<span class="tag-chip">${escapeHtml(a)}<button type="button" onclick="removeFormAssignee('${escapeHtml(a)}')" aria-label="${escapeHtml(a)} 제거">&times;</button></span>`
      ).join('');
    }

    function addFormTag(tag) {
      if (formTags.includes(tag)) return;
      formTags.push(tag);
      renderFormTags();
    }

    function removeFormTag(tag) {
      formTags = formTags.filter(t => t !== tag);
      renderFormTags();
    }

    function renderFormTags() {
      document.getElementById('tagChips').innerHTML = formTags.map(t =>
        `<span class="tag-chip">#${escapeHtml(t)}<button type="button" onclick="removeFormTag('${escapeHtml(t)}')" aria-label="${escapeHtml(t)} 태그 제거">&times;</button></span>`
      ).join('');
    }

    function addChecklistItem() {
      const input = document.getElementById('checklistInput');
      const val = input.value.trim();
      if (!val) return;
      const id = Date.now();
      formSubtasks.push({ id, text: val, done: false });
      renderFormSubtasks();
      input.value = '';
    }

    function removeChecklistItem(id) {
      formSubtasks = formSubtasks.filter(s => s.id !== id);
      renderFormSubtasks();
    }

    function renderFormSubtasks() {
      document.getElementById('checklistItems').innerHTML = formSubtasks.map(s =>
        `<div class="checklist-item-row">
          <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleFormSubtask(${s.id})">
          <span style="flex:1;font-size:var(--font-size-sm);">${escapeHtml(s.text)}</span>
          <button type="button" class="btn-icon-small" onclick="removeChecklistItem(${s.id})" aria-label="항목 제거">×</button>
        </div>`
      ).join('');
    }

    function toggleFormSubtask(id) {
      const s = formSubtasks.find(s => s.id === id);
      if (s) s.done = !s.done;
    }

    async function createTask(e) {
      e.preventDefault();
      const title = document.getElementById('fTitle').value.trim();
      const description = document.getElementById('fDescription').value.trim();
      const priority = document.getElementById('fPriority').value;
      const dueDate = document.getElementById('fDueDate').value;

      // 담당자: 입력창에 남은 값도 포함
      const rawInput = document.getElementById('fAssigneeInput').value.trim();
      if (rawInput) addFormAssignee(rawInput);

      if (!title) { showAlert('제목을 입력하세요', 'error'); return; }

      const newTask = {
        id: Date.now(),
        title,
        description,
        assignees: [...formAssignees],
        status: 'pending',
        priority,
        due_date: dueDate || null,
        tags: [...formTags],
        subtasks: formSubtasks.map(s => ({ ...s })),
        created_by: currentUser ? currentUser.username : 'admin',
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
      };

      allTasks.unshift(newTask);
      saveData();
      updateAssigneeFilter();
      renderAll();

      // 폼 초기화
      document.getElementById('taskForm').reset();
      formAssignees = []; formTags = []; formSubtasks = [];
      renderFormAssignees(); renderFormTags(); renderFormSubtasks();

      showAlert('태스크가 생성되었습니다', 'success');

      // 백엔드 API 연동 시도
      try {
        await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(typeof getAuthHeaders === 'function' ? getAuthHeaders() : {}) },
          body: JSON.stringify({
            title: newTask.title,
            description: newTask.description,
            assignee: newTask.assignees.join(', '),
            dueDate: newTask.due_date,
            priority: newTask.priority,
            status: 'pending',
            createdBy: newTask.created_by,
          }),
        });
      } catch (_) { /* 로컬 저장으로 동작 계속 */ }
    }

    /* ==========================================
       모달 (상세보기 + 댓글)
       ========================================== */
    function openModal(taskId) {
      currentTaskId = taskId;
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById('modalTitle').textContent = task.title;

      // 상태 스텝
      document.querySelectorAll('.status-step').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === task.status);
      });

      // 메타
      const priorityLabels = { high: '🔴 높음', medium: '🟡 중간', low: '🟢 낮음' };
      document.getElementById('modalPriority').textContent = priorityLabels[task.priority] || task.priority;
      document.getElementById('modalDueDate').textContent = task.due_date || '미지정';
      document.getElementById('modalCreatedBy').textContent = task.created_by || '-';
      document.getElementById('modalUpdatedAt').textContent = task.updated_at ? new Date(task.updated_at).toLocaleString('ko-KR') : '-';

      // 설명
      const descEl = document.getElementById('modalDescription');
      descEl.textContent = task.description || '설명 없음';
      document.getElementById('modalDescSection').style.display = task.description ? '' : 'none';

      // 담당자
      const colors = ['#E60012','#3b82f6','#8b5cf6','#f59e0b','#10b981'];
      document.getElementById('modalAssignees').innerHTML = (task.assignees || []).map((a, i) =>
        `<div class="assignee-chip"><div class="avatar" style="background:${colors[i%colors.length]};">${escapeHtml(a.substring(0,2))}</div><span>${escapeHtml(a)}</span></div>`
      ).join('') || '<span style="color:var(--text-secondary);font-size:var(--font-size-sm);">담당자 없음</span>';

      // 서브태스크
      renderModalChecklist(task);

      // 태그
      const tagsHtml = (task.tags || []).map(t => `<span class="task-tag">#${escapeHtml(t)}</span>`).join('');
      document.getElementById('modalTags').innerHTML = tagsHtml || '<span style="color:var(--text-secondary);font-size:var(--font-size-sm);">태그 없음</span>';
      document.getElementById('modalTagSection').style.display = '';

      // 댓글
      renderComments(taskId);

      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderModalChecklist(task) {
      const subs = task.subtasks || [];
      if (subs.length === 0) {
        document.getElementById('modalChecklist').innerHTML = '<div style="padding:var(--space-3);color:var(--text-secondary);font-size:var(--font-size-sm);">서브태스크 없음</div>';
        return;
      }
      document.getElementById('modalChecklist').innerHTML = subs.map(s => `
        <div class="sub-task-item ${s.done ? 'checked' : ''}">
          <input type="checkbox" id="sub_${s.id}" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${task.id}, ${s.id})">
          <label for="sub_${s.id}">${escapeHtml(s.text)}</label>
          <button class="btn-icon-small" onclick="removeSubtask(${task.id}, ${s.id})" aria-label="항목 삭제">×</button>
        </div>`).join('');
    }

    function toggleSubtask(taskId, subId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      const sub = (task.subtasks || []).find(s => s.id === subId);
      if (sub) { sub.done = !sub.done; task.updated_at = new Date().toISOString(); }
      saveData();
      renderModalChecklist(task);
      renderAll();
    }

    function removeSubtask(taskId, subId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks = (task.subtasks || []).filter(s => s.id !== subId);
      task.updated_at = new Date().toISOString();
      saveData();
      renderModalChecklist(task);
      renderAll();
    }

    function addModalChecklist() {
      const input = document.getElementById('modalChecklistInput');
      const val = input.value.trim();
      if (!val || !currentTaskId) return;
      const task = allTasks.find(t => t.id === currentTaskId);
      if (!task) return;
      if (!task.subtasks) task.subtasks = [];
      task.subtasks.push({ id: Date.now(), text: val, done: false });
      task.updated_at = new Date().toISOString();
      saveData();
      renderModalChecklist(task);
      renderAll();
      input.value = '';
    }

    function changeModalStatus(status) {
      if (!currentTaskId) return;
      const task = allTasks.find(t => t.id === currentTaskId);
      if (!task) return;
      task.status = status;
      task.updated_at = new Date().toISOString();
      saveData();
      renderAll();

      document.querySelectorAll('.status-step').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === status);
      });
    }

    function saveModalChanges() {
      closeModal();
      showAlert('변경사항이 저장되었습니다', 'success');
    }

    function deleteCurrentTask() {
      if (!currentTaskId) return;
      if (!confirm('이 태스크를 삭제하시겠습니까?')) return;
      allTasks = allTasks.filter(t => t.id !== currentTaskId);
      delete allComments[currentTaskId];
      saveData();
      updateAssigneeFilter();
      renderAll();
      closeModal();
      showAlert('태스크가 삭제되었습니다', 'success');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
      currentTaskId = null;
    }

    function closeModalOnBg(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    // ESC로 모달 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ==========================================
       댓글
       ========================================== */
    function renderComments(taskId) {
      const comments = allComments[taskId] || [];
      const label = document.getElementById('commentCountLabel');
      label.textContent = comments.length ? `(${comments.length})` : '';

      const list = document.getElementById('commentList');
      if (comments.length === 0) {
        list.innerHTML = '<p style="font-size:var(--font-size-sm);color:var(--text-secondary);">아직 댓글이 없습니다.</p>';
        return;
      }

      const colors = ['#E60012','#3b82f6','#8b5cf6','#f59e0b','#10b981'];
      list.innerHTML = comments.map((c, i) => `
        <div class="comment-item">
          <div class="avatar" style="background:${colors[i % colors.length]};flex-shrink:0;">${escapeHtml((c.author || 'U').substring(0,2))}</div>
          <div class="comment-body">
            <div class="comment-meta">
              <span class="comment-author">${escapeHtml(c.author)}</span>
              <span class="comment-time">${new Date(c.created_at).toLocaleString('ko-KR')}</span>
            </div>
            <p class="comment-text">${escapeHtml(c.text)}</p>
          </div>
        </div>`).join('');
    }

    function addComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !currentTaskId) return;

      if (!allComments[currentTaskId]) allComments[currentTaskId] = [];
      allComments[currentTaskId].push({
        id: Date.now(),
        author: currentUser ? currentUser.username : 'admin',
        text,
        created_at: new Date().toISOString(),
      });

      saveData();
      renderComments(currentTaskId);
      renderAll(); // 댓글 수 업데이트
      input.value = '';
    }

    function handleCommentKey(e) {
      if (e.key === 'Enter' && e.ctrlKey) { addComment(); }
    }

    /* ==========================================
       공통 유틸
       ========================================== */
    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      const el = document.createElement('div');
      el.className = `alert alert-${type}`;
      el.textContent = message;
      container.innerHTML = '';
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const d = document.createElement('div');
      d.textContent = String(text);
      return d.innerHTML;
    }
  </script>
  <!-- nav.js: 공통 모바일 햄버거 메뉴 -->
  <script src="../js/nav.js"></script>
</body>
