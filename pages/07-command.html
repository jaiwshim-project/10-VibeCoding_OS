<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCOS — 06 Claude Code 명령어 생성</title>
<link rel="stylesheet" href="../vcos.css">
<script src="../vcos-skills.js"></script>
<style>
/* 06 명령어 생성 */
.output-wrap { position:relative }
.output-cmd {
  background:#0d1b2e;border:1.5px solid #1e3a5f;
  border-radius:var(--r-md);padding:20px 22px;
  font-family:'JetBrains Mono','Fira Code',monospace;
  font-size:12px;line-height:1.9;white-space:pre-wrap;word-break:break-all;
  color:#e2e8f0;max-height:600px;overflow-y:auto;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.15);
}
.action-strip { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px }

.summary-grid {
  display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px;margin-bottom:18px;
}
.summary-item {
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r-md);padding:16px 12px;text-align:center;
  box-shadow:var(--shadow-xs);
  transition:transform var(--med),box-shadow var(--med);
}
.summary-item:hover { transform:translateY(-2px);box-shadow:var(--shadow-md) }
.summary-icon  { font-size:24px;margin-bottom:5px }
.summary-label { font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:700 }
.summary-val   { font-size:13.5px;font-weight:800;color:var(--text);margin-top:3px }

.tab-bar2 { display:flex;gap:5px;margin-bottom:13px;flex-wrap:wrap }
.tab2 {
  padding:7px 16px;border-radius:var(--r-full);
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text2);font-size:12px;cursor:pointer;
  font-weight:500;transition:all var(--fast);
}
.tab2:hover  { border-color:var(--accent);color:var(--accent);background:var(--accent-light) }
.tab2.active {
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-light);font-weight:700;
}

.ready-box {
  background:var(--green-bg);border:1.5px solid rgba(22,163,74,.25);
  border-radius:var(--r-lg);padding:18px;margin-bottom:18px;
  border-left:4px solid var(--green);
}
.checklist-item { display:flex;align-items:center;gap:8px;padding:5px 0 }
.check-icon     { font-size:14px;flex-shrink:0 }
.check-text     { font-size:12.5px;color:var(--text2);font-weight:500 }

.phase2-banner {
  background:linear-gradient(135deg,#fff7ed,#ffedd5);
  border:1.5px solid rgba(234,88,12,.3);
  border-left:4px solid #ea580c;
  border-radius:var(--r-lg);padding:18px 20px;margin-top:28px;
  display:flex;align-items:center;gap:16px;
}
.phase2-icon { font-size:36px;flex-shrink:0 }
.phase2-title { font-size:15px;font-weight:800;color:#c2410c;margin-bottom:4px }
.phase2-desc  { font-size:12.5px;color:var(--text2);line-height:1.6 }
</style>
</head>
<body>
<div class="vcos-header"><div id="navArea"></div></div>
<div class="container"><div class="page-body">

<div class="progress-steps" id="progressBar"></div>

<div class="page-title">
  <div class="page-num" style="background:linear-gradient(135deg,#38bdf8,#0369a1);box-shadow:0 3px 12px rgba(3,105,161,.4)">7</div>
  <div><div class="page-name">Claude Code 명령어 생성</div><div class="page-eng">Vibe Command Generator — 1~5 섹션 통합 → 완성 바이브 코딩 명령어</div></div>
  <div class="page-badge">FINAL OUTPUT</div>
</div>

<div id="content"></div>

<div class="page-nav">
  <a href="06-token.html" class="btn btn-secondary">← 이전: 토큰 최적화</a>
  <div class="page-nav-center">Section 7 / 7</div>
  <a href="../index.html" class="btn btn-secondary">🏠 허브로 돌아가기</a>
</div>

</div></div>
<div id="footerArea"></div>
<script src="../vcos.js"></script>
<script>
document.getElementById('navArea').innerHTML = buildNav('7', false);
document.getElementById('progressBar').innerHTML = buildProgress('7');
document.getElementById('footerArea').innerHTML = buildFooter(false);

const p = requireProject('../pages/01-intent.html');
if (!p) throw new Error('no project');

const c = calcComplexity(p);
const type = getProjectType(c.total);
const squads = buildSquads(p, c);
const skills = (typeof getRelevantSkills === 'function')
  ? getRelevantSkills(p, c).filter(s => s.active)
  : [];
const tk = calcTokenEstimate(c);
const rs = calcRefineScores(c);
const v4 = rs.v4;

const _baseCmd = (typeof generateCommand === 'function') ? generateCommand(p, c) : buildFallbackCommand(p, c);

/* ── AI 협업 사전 검토 사항 주입 ── */
function buildCollabNotes() {
  try {
    const collab = JSON.parse(localStorage.getItem('vcosAiCollab') || '{}');
    const qNotes = collab.qNotes || [];
    const selectedQ = collab.selectedQ || [];
    const qLabels = [
      '구조적 리스크',
      '누락 항목',
      '파괴 시나리오',
      '엣지 케이스',
      '단순화 사항',
      'UX 개선 사항'
    ];
    const lines = qNotes
      .map((note, i) => note && note.trim() ? `  • [${qLabels[i]}] ${note.trim()}` : '')
      .filter(Boolean);
    if (!lines.length) return '';
    return `\n\n## ⚠️ 사전 검토 사항 (AI 협업 준비 단계 입력)\n\n${lines.join('\n')}`;
  } catch(e) { return ''; }
}

const cmd = _baseCmd + buildCollabNotes();

function buildFallbackCommand(p, c) {
  const type = getProjectType(c.total);
  const feats = (p.features||[]).map(f => `- ${FEATURE_LABELS[f]||f}`).join('\n') || '- (기능 목록)';
  const squadCmd = (c.total < 16) ? '/platoon-formation-v1' : '/platoon-formation-v2';
  return `## 🚀 VCOS — VIBE CODING COMMAND

PROJECT : ${p.name||''}
TYPE    : ${type.label} (복잡도 ${c.total}점)
STACK   : ${p.techStack||''}

## 📋 PROJECT INTENT

${p.purpose||''}

핵심 기능:
${feats}

## 👥 ORGANIZATION

분대 편성: ${squadCmd}
투입 분대: ${squads.length}개

## ⚡ EXECUTION

1. ${squadCmd} 실행
2. 핵심 기능 순서대로 구현
3. 완성 후 /review-evaluate 최소 3회 실행
4. ${rs.v4}점 달성 시 프로덕션 배포`;
}

let activeTab = 'full';

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab2').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (_skillsExpanded) { _skillsExpanded = false; document.getElementById('btnExpandSkills').textContent = '📖 스킬 내용 펼치기'; }
  renderCmd();
}

/* ── 1~6단계 전체 통합 명령어 생성 ── */
function buildAllSectionsCmd() {
  try {
    const collab = JSON.parse(localStorage.getItem('vcosAiCollab') || '{}');
    const squadCmd = (c.total < 16) ? '/platoon-formation-v1' : '/platoon-formation-v2';
    const feats = (p.features||[]).map(f => `  - ${FEATURE_LABELS[f]||f}`).join('\n') || '  - (없음)';
    const scaleLabels = ['','개인 프로젝트','스타트업 MVP','중규모 서비스','엔터프라이즈'];
    const aiLabels   = ['없음','기본 (챗봇/Q&A)','중급 (추천/분석)','고급 (RAG/에이전트)'];
    const qLabels    = ['구조적 리스크','누락 항목','파괴 시나리오','엣지 케이스','단순화 사항','UX 개선 사항'];
    const qNoteLines = (collab.qNotes||[]).map((note,i) => note&&note.trim() ? `  [${qLabels[i]}] ${note.trim()}` : '').filter(Boolean).join('\n') || '  (없음)';
    const squadDesc  = squads.filter(s=>s.id!=='hq').map(s => `  ${s.emoji} ${s.name}: ${s.role}`).join('\n');
    const skillList  = skills.length ? skills.map(s => `  ${s.emoji||'⚡'} ${s.name}\n     📌 ${s.desc||s.short||''}\n     시점: ${s.when||''} | 모델: ${s.model||''} | 명령: ${s.cmd||''}`).join('\n\n') : '  (없음)';

    return `## 🚀 VCOS — 1~6단계 통합 바이브 코딩 명령어

════════════════════════════════════════
## SECTION 1. 프로젝트 인텐트
════════════════════════════════════════

PROJECT  : ${p.name||''}
PURPOSE  : ${p.purpose||''}
USERS    : ${Array.isArray(p.users)?p.users.join(', '):''}
STACK    : ${p.techStack||''}
SCALE    : ${scaleLabels[p.scale||1]}
AI LEVEL : ${aiLabels[p.aiLevel||0]}

기능 목록:
${feats}

════════════════════════════════════════
## SECTION 2. AI 협업 준비
════════════════════════════════════════

진짜 문제     : ${collab.realProblem||'(미입력)'}
정제된 인텐트 : ${collab.refinedIntent||'(미입력)'}
✅ 결정된 것  : ${collab.memoDecided||'(미입력)'}
⏳ 미결 이슈  : ${collab.memoPending||'(미입력)'}
📌 주요 맥락  : ${collab.memoContext||'(미입력)'}

사전 검토 사항:
${qNoteLines}

════════════════════════════════════════
## SECTION 3. 복잡도 분석
════════════════════════════════════════

복잡도 점수  : ${c.total}점
프로젝트 타입 : ${type.label} ${type.badge}
기능 수      : ${c.featureCount}개
  UI/UX      : ${c.ui}점
  백엔드      : ${c.backend}점
  AI 기능    : ${c.ai}점
  외부 연동  : ${c.integration}점
  데이터      : ${c.data}점
  보안        : ${c.security}점

════════════════════════════════════════
## SECTION 4. 분대 편성
════════════════════════════════════════

분대 편성 명령 : ${squadCmd}
투입 분대      : ${squads.length}개

${squadDesc}

════════════════════════════════════════
## SECTION 5. 스킬 전략
════════════════════════════════════════

활성 스킬 : ${skills.length}개

${skillList}

════════════════════════════════════════
## SECTION 6. 토큰 최적화
════════════════════════════════════════

예상 총 토큰 : ${tk.total.toLocaleString()}
예상 비용    : $${tk.cost}
  Haiku      : ${tk.haiku.toLocaleString()} (60%)
  Sonnet     : ${tk.sonnet.toLocaleString()} (35%)
  Opus       : ${tk.opus.toLocaleString()} (5%)

════════════════════════════════════════
## EXECUTION ORDER
════════════════════════════════════════

1. ${squadCmd} 실행
2. 핵심 기능 순서대로 구현
3. 완성 후 /review-evaluate 최소 3회 실행
4. ${rs.v4}점 달성 시 프로덕션 배포`;
  } catch(e) { return '데이터 로드 오류: ' + e.message; }
}

function getTabContent() {
  if (activeTab === 'full') return cmd;
  if (activeTab === 'allsections') return buildAllSectionsCmd();
  if (activeTab === 'mission') {
    const feats = (p.features||[]).map(f => `- ${FEATURE_LABELS[f]||f}`).join('\n') || '- (기능 목록)';
    return `## 📋 PROJECT INTENT\n\nProject : ${p.name||''}\nPurpose : ${p.purpose||''}\nUsers   : ${Array.isArray(p.users)?p.users.join(', '):''}\nType    : ${type.label}\nStack   : ${p.techStack||''}\n\n## 🎯 MISSION\n\n${p.purpose||p.name+' 플랫폼'}\n\n핵심 기능:\n${feats}`;
  }
  if (activeTab === 'squad') {
    const squadCmd = (c.total < 16) ? '/platoon-formation-v1' : '/platoon-formation-v2';
    const squadDesc = squads.filter(s=>s.id!=='hq').map(s => `- ${s.name}: ${s.role}`).join('\n');
    return `## 👥 AI DEVELOPMENT ORGANIZATION\n\n소대 편성 명령: ${squadCmd}\n투입 분대: ${squads.length}개\n\n${squadDesc}`;
  }
  if (activeTab === 'skills') {
    if (!skills.length) return '## ⚡ SKILL EXECUTION STRATEGY\n\n스킬 데이터 없음';
    const fc = window.SKILL_FULL_CONTENTS || {};
    return `## ⚡ SKILL EXECUTION STRATEGY\n\n프로젝트 적용 스킬 (${skills.length}개):\n\n` +
      skills.map(s => {
        const full = fc[s.cmd] || fc[s.name];
        const header = `${'═'.repeat(60)}\n${s.emoji||'⚡'} ${s.name}  |  시점: ${s.when||''}  |  모델: ${s.model||''}\n${'═'.repeat(60)}`;
        return full ? header + '\n\n' + full : header + `\n\n📌 ${s.desc||s.short||''}\n   명령: ${s.cmd||''}`;
      }).join('\n\n');
  }
  return cmd;
}

function renderCmd() {
  document.getElementById('cmdOutput').textContent = getTabContent();
}

function downloadCmd() {
  const blob = new Blob([cmd], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.name||'vcos-command').replace(/[^a-z0-9가-힣]/gi,'_') + '_vcos.md';
  a.click();
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✅ 복사됨!';
    setTimeout(() => btn.textContent = orig, 1800);
  });
}

const savedTime = p.savedAt ? new Date(p.savedAt).toLocaleString('ko-KR') : '알 수 없음';
const squadCmd = (c.total < 16) ? '/platoon-formation-v1' : '/platoon-formation-v2';

document.getElementById('content').innerHTML = `
<div class="ready-box">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <span style="font-size:24px">✅</span>
    <div>
      <div style="font-size:14px;font-weight:700;color:var(--green)">바이브 코딩 명령어 생성 완료!</div>
      <div style="font-size:11px;color:var(--text2);margin-top:2px">1~5 섹션 데이터를 통합하여 Claude Code 실행 명령어를 생성했습니다. 복사 후 터미널에 붙여넣으세요.</div>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">프로젝트: ${p.name}</span></div>
    <div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">복잡도: ${type.label} (${c.total}점)</span></div>
    <div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">분대: ${squads.length}개 편성</span></div>
    <div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">스킬: ${skills.length}개 선택</span></div>
    <div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">목표 점수: ${v4}점</span></div>
    ${(() => { try { const c2=JSON.parse(localStorage.getItem('vcosAiCollab')||'{}'); const n=(c2.qNotes||[]).filter(x=>x&&x.trim()).length; return n ? `<div class="checklist-item"><span class="check-icon">✅</span><span class="check-text">사전 검토: ${n}개 항목 반영</span></div>` : ''; } catch(e){return '';} })()}
  </div>
</div>

<div class="summary-grid">
  <div class="summary-item">
    <div class="summary-icon">📋</div>
    <div class="summary-label">프로젝트</div>
    <div class="summary-val" style="font-size:11px">${(p.name||'').length>15 ? (p.name||'').slice(0,15)+'…' : (p.name||'')}</div>
  </div>
  <div class="summary-item">
    <div class="summary-icon">🎯</div>
    <div class="summary-label">프로젝트 타입</div>
    <div class="summary-val" style="color:${type.color}">${type.label}</div>
  </div>
  <div class="summary-item">
    <div class="summary-icon">🏛️</div>
    <div class="summary-label">투입 분대</div>
    <div class="summary-val">${squads.length}개 분대</div>
  </div>
  <div class="summary-item">
    <div class="summary-icon">🧩</div>
    <div class="summary-label">활성 스킬</div>
    <div class="summary-val">${skills.length}개</div>
  </div>
  <div class="summary-item">
    <div class="summary-icon">⭐</div>
    <div class="summary-label">목표 품질</div>
    <div class="summary-val" style="color:var(--green)">${v4}점</div>
  </div>
</div>

<div class="tab-bar2">
  <button class="tab2 active" data-tab="full" onclick="setTab('full')">📄 전체 명령어</button>
  <button class="tab2" data-tab="allsections" onclick="setTab('allsections')" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-color:#2563eb;font-weight:700">📊 1~6단계 통합</button>
  <button class="tab2" data-tab="mission" onclick="setTab('mission')">🎯 Mission 파트</button>
  <button class="tab2" data-tab="squad" onclick="setTab('squad')">🪖 Squad 파트</button>
  <button class="tab2" data-tab="skills" onclick="setTab('skills')">⚡ Skills 파트</button>
</div>

<div class="output-wrap">
  <pre class="output-cmd" id="cmdOutput"></pre>
  <div class="action-strip">
    <button class="btn btn-primary btn-lg" onclick="copyText(getTabContent(), this)">📋 복사 (현재 탭)</button>
    <button class="btn btn-primary" onclick="copyText(cmd, this)">📋 전체 복사</button>
    <button class="btn btn-primary" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);border:none" onclick="copyText(buildAllSectionsCmd(), this)">📊 1~6단계 통합 복사</button>
    <button class="btn btn-success" onclick="downloadCmd()">⬇️ .md 파일 다운로드</button>
    <button class="btn btn-secondary" onclick="location.href='01-intent.html'">✏️ 프로젝트 수정</button>
    <button class="btn btn-secondary" id="btnExpandSkills" onclick="toggleSkillExpand(this)">📖 스킬 내용 펼치기</button>
  </div>
</div>

<div class="divider-label" style="margin-top:28px"><span>실행 가이드</span></div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">🚀 Claude Code 실행 순서</div>
    ${[
      { n:'1', text:`터미널에서 <code style="background:var(--bg);padding:1px 5px;border-radius:3px;font-size:11px">cd 프로젝트_폴더</code> 실행` },
      { n:'2', text:`<code style="background:var(--bg);padding:1px 5px;border-radius:3px;font-size:11px">claude</code> 명령어로 Claude Code 실행` },
      { n:'3', text:`위 명령어를 전체 복사해서 Claude Code에 붙여넣기` },
      { n:'4', text:`분대 편성: <code style="background:var(--bg);padding:1px 5px;border-radius:3px;font-size:11px">${squadCmd}</code>` },
      { n:'5', text:`개발 진행 → 결과물 완성` },
      { n:'6', text:`결과물 완성 후 → <strong style="color:#ea580c">Phase 2 고도화 엔진</strong> 적용` }
    ].map(step => `
      <div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">${step.n}</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5">${step.text}</div>
      </div>
    `).join('')}
  </div>
  <div class="card">
    <div class="card-title">🪖 용병 AI 병렬 활용</div>
    ${[
      { icon:'💎', name:'Gemini', when:'대규모 코드 리뷰', cmd:'gemini -p "..."' },

# Platoon Formation (소대 편제 방식 팀구성)

현재 프로젝트 디렉토리 이름을 기반으로 Agent Teams 소대(42명)를 편성하고, 용병(CLI/API/MCP)을 전략적으로 활용하여 임무를 수행한다.

---

## Phase 1. 팀 생성 및 소대 편성

### Step 1: 팀 생성
- 현재 작업 디렉토리의 폴더명을 추출하여 `{폴더명}-platoon` 이름으로 TeamCreate 실행
- 예: 작업 디렉토리가 `mychatbot-world`이면 → `mychatbot-platoon`

### Step 1-1: HQ 편성 (본부)

| 직책 | 역할 | 모델 | 비고 |
|------|------|------|------|
| **소대장** (team-lead) | Orchestrator, 전략적 의사결정 | opus | 직접 코딩 최소화 |
| **연락병** (Chatbot) | 지휘관(User) ↔ 소대장 간 연락 | - | 채팅 인터페이스 |

### Step 2: 분대장 스폰 (NATO 호출부호)

3명의 Teammate를 백그라운드로 스폰한다.

| 호출부호 | 직책 | 기본 역할 | 모델 |
|---------|------|----------|------|
| **Alpha** | 1분대장 | 역할 미정 (임무 시 배정) | sonnet |
| **Bravo** | 2분대장 | 역할 미정 (임무 시 배정) | sonnet |
| **Charlie** | 3분대장 | 역할 미정 (임무 시 배정) | sonnet |

### Step 2-1: 표준 정규병 11명 (각 분대 공통)

| # | Sub-Agent | 역할 | 기본 모델 |
|---|-----------|------|----------|

| 2 | backend-developer | 백엔드 API / 서버 로직 | sonnet |

**투입 원칙:** 단순 반복 = haiku, 복잡한 코드/분석 = sonnet, opus 사용 금지

## Phase 2. 용병 투입 전략 (외부 AI — 공유 풀)

# /review-evaluate — 검토 및 평가 (Review & Evaluate)

콘텐츠를 **검토(Review)**하여 문제점을 파악하고, 직접 **수정(Fix)**한 뒤, **평가(Evaluate)**하여 품질 점수를 부여한다.
**97점 이상 도달할 때까지 최소 3회 순환**한다.

## Usage
/review-evaluate [file_path_or_directory]

---

## Phase 1. 평가 대상 결정

- 인자가 있는 경우: 해당 파일/디렉토리를 대상으로 한다.
- 인자가 없는 경우: 직전 실행 이후 작업(생성/수정)한 모든 파일을 대상으로 한다.
- 대상이 모호하면 AskUserQuestion으로 사용자(PO)에게 확인한다.

---

## Phase 2. 순환 루프 (Review → Fix → Evaluate)

**최소 3회 반복, 97점 이상 도달 시 종료 조건 진입.**

```
┌─────────────────────────────────────────────┐
│            순환 루프 (Round N)                │
│                                             │
│  Step 1. 검토 (Review) — 문제점 식별 + 분류  │
│  Step 2. 수정 (Fix)    — 발견 문제점 직접 수정│
│  Step 3. 평가 (Evaluate) — 5기준 점수 산정   │
│                                             │
│  판단:                                       │
│    Round < 3           → 다음 라운드 계속    │
│    Round >= 3, < 97점  → 다음 라운드 계속    │
│    Round >= 3, >= 97점 → Phase 3 진입        │
└─────────────────────────────────────────────┘
```

### Step 1: 검토 (Review)

심각도 분류: [Critical] → [High] → [Medium] → [Low]

각 문제점: 설명 (파일명:줄번호) + 수정 제안

### Step 2: 수정 (Fix)

- Critical / High: 반드시 수정
- Medium: 가능하면 수정
- Low: 선택적 수정

### Step 3: 평가 기준 (각 20점, 총 100점)

| 기준 | 내용 |
|------|------|
| 기술적 정확성 | 정보의 정확성과 최신성 |
| 가독성 | 읽기 쉬움과 이해 용이성 |
| 구조 및 구성 | 논리적 흐름과 체계적 배치 |
| 완성도 | 주제의 포괄적 커버리지 |
| 유용성 | 실용적 활용 가능성 |

평가 보고 형식:
```
📊 평가 결과 (Round N)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⭐ 종합 평점: XX/100점
• 기술적 정확성: XX/20점
• 가독성: XX/20점
• 구조 및 구성: XX/20점
• 완성도: XX/20점
• 유용성: XX/20점
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
```

---

## Phase 3. 97점 도달 — 종료 확인

```
✅ 품질 목표 달성 (Round N)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⭐ 최종 평점: XX/100점 (목표 97점 달성)
🔄 총 라운드: N회

추가 검토·평가를 진행하시겠습니까?
- [완료] 검토·평가 종료
- [추가] 1회 더 검토·평가 수행
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
```

---

## Execution Flow 요약

```
1. 평가 대상 결정
2. Round 1~3 이상: 검토 → 수정 → 평가 (97점 미만이면 계속)
3. 97점 이상 + 3회 이상 → 사용자(PO)에게 추가 여부 확인
4. 종료 또는 추가 라운드
```
